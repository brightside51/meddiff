data:
  base_fp: /nas-ctm01/homes/pfsousa/data
  batch_size: 1
  dataV: V0
  data_format: dicom
  data_fp: /nas-ctm01/datasets/private/METABREST/T1W_Breast
  data_prep: true
  dataset: metabreast
  device: !!python/object/apply:torch.device
  - cuda
  - 0
  h_flip: 50
  img_channel: 1
  img_size: 128
  num_fps: 4
  num_slice: 30
  num_workers: 12
  prefetch_factor: 1
  reader_fp: /nas-ctm01/homes/pfsousa/data/metabreast
  shuffle: true
  slice_bottom_margin: 5
  slice_spacing: false
  slice_top_margin: 15
  test_split: 0
  val_split: 0
  verbose: true
run:
  base_fp: /nas-ctm01/homes/pfsousa
  log_interval: 1
  log_method: wandb
  logs_fp: /nas-ctm01/homes/pfsousa/meddiff/logs/run_V0
  model: meddiff
  num_gpu: 1
  runV: V0
  save_img: 2
  save_interval: 500
  script_fp: /nas-ctm01/homes/pfsousa/meddiff
  seed: 1234
  verbose: true
  vqgan: !!python/object:argparse.Namespace
    dim_latent: 8
    disc_channel: 64
    disc_layer: 3
    disc_loss: hinge
    disc_start: 50000
    downsample:
    - 2
    - 2
    - 2
    ganfeat_weight: 1.0
    grad_accum: 1
    grad_clip: 1.0
    i3d_feat: false
    img_weight: 1.0
    l1_weight: 4.0
    lr_base: 0.0003
    lr_decay: 0.999
    lr_min: 1.0e-06
    lr_step: 250
    norm_type: group
    num_codes: 16384
    num_epochs: -1
    num_groups: 32
    num_hidden: 16
    num_steps: -1
    pad_type: replicate
    percept_weight: 0.0
    rand_restart: false
    restart_thres: 1.0
    resume: false
    resume_ckpt: /nas-ctm01/homes/pfsousa/meddiff/logs/run_V0/vqgan/latest.ckpt
    vid_weight: 1.0
