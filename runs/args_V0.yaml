base_fp: /nas-ctm01/homes/pfsousa
log_interval: 1
log_method: wandb
logs_fp: /nas-ctm01/homes/pfsousa/meddiff/logs/run_V0
model: meddiff
num_gpu: 1
runV: V0
save_img: 2
save_interval: 500
script_fp: /nas-ctm01/homes/pfsousa/meddiff
seed: 1234
verbose: true
vqgan:
  dim_latent: 32
  disc_channel: 64
  disc_layer: 3
  disc_loss: hinge
  disc_start: 80000
  downsample:
  - 2
  - 2
  - 2
  ganfeat_weight: 2.0
  grad_accum: 1
  grad_clip: 1.0
  i3d_feat: false
  img_weight: 1.0
  l1_weight: 10.0
  lr_base: 0.0001
  lr_decay: 0.995
  lr_min: 1.0e-06
  lr_step: 1000
  norm_type: group
  num_codes: 8192
  num_epochs: -1
  num_groups: 8
  num_hidden: 64
  num_steps: -1
  pad_type: replicate
  percept_weight: 0.0
  rand_restart: true
  restart_thres: 0.1
  resume: false
  resume_ckpt: /nas-ctm01/homes/pfsousa/meddiff/logs/run_V0/vqgan/latest.ckpt
  vid_weight: 1.0
